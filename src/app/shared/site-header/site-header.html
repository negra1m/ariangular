<!--
  Header flutuante, pequeno e centralizado — não uma barra que atravessa a tela.
  Continua sendo o landmark de banner e o primeiro grupo de controles do DOM.
-->
<header class="hdr">
  <div class="hdr__bar">
    <a class="hdr__home" [routerLink]="locale.path()" [attr.aria-label]="locale.strings().home">
      <span class="hdr__glyph" aria-hidden="true">&gt;|&lt;</span>
    </a>

    <span class="hdr__dots" aria-hidden="true">•••••</span>

    <app-site-search />

    <button
      type="button"
      class="hdr__menu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-principal"
      [attr.aria-label]="menuOpen() ? locale.strings().closeMenu : locale.strings().openMenu"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'FECHAR' : 'MENU' }}
    </button>
  </div>
</header>

<!--
  Menu em overlay, no padrão da referência: lista numerada com divisórias.
  É um modal na prática — foco preso, ESC fecha, foco volta ao botão.
-->
@if (menuOpen()) {
  <div class="menu" id="menu-principal" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <nav class="menu__panel" [attr.aria-label]="locale.strings().nav">
      <ul class="menu__list">
        @for (part of parts(); track part.id) {
          <li class="menu__row">
            <a
              class="menu__link"
              [routerLink]="locale.path(part.id)"
              routerLinkActive="is-active"
              #rla="routerLinkActive"
              [attr.aria-current]="rla.isActive ? 'page' : null"
              (click)="closeMenu()"
            >
              <span class="menu__num" aria-hidden="true">{{ part.numeral }}</span>
              <span class="menu__name">{{ part.title }}</span>
            </a>
          </li>
        }

        <li class="menu__row">
          <a
            class="menu__link"
            [routerLink]="locale.path('checklists')"
            routerLinkActive="is-active"
            #rlc="routerLinkActive"
            [attr.aria-current]="rlc.isActive ? 'page' : null"
            (click)="closeMenu()"
          >
            <span class="menu__num" aria-hidden="true">08</span>
            <span class="menu__name">{{ locale.strings().checklists }}</span>
          </a>
        </li>

        <li class="menu__row">
          <a
            class="menu__link"
            [routerLink]="locale.path('auditor')"
            routerLinkActive="is-active"
            #rlau="routerLinkActive"
            [attr.aria-current]="rlau.isActive ? 'page' : null"
            (click)="closeMenu()"
          >
            <span class="menu__num" aria-hidden="true">09</span>
            <span class="menu__name">{{ locale.strings().auditor }}</span>
          </a>
        </li>
      </ul>

      <div class="menu__art" aria-hidden="true">
        <app-ascii-art motif="sound-wave" [cols]="64" [rows]="12" />
      </div>

      <div class="menu__footer">
        <div class="menu__locales" role="group" [attr.aria-label]="locale.strings().language">
          @for (l of locales; track l) {
            <button
              type="button"
              class="menu__locale"
              [class.is-active]="locale.locale() === l"
              [attr.aria-current]="locale.locale() === l ? 'true' : null"
              [attr.lang]="l === 'zh' ? 'zh-Hans' : l"
              (click)="switchLocale(l)"
            >
              {{ localeLabel[l] }}
            </button>
          }
        </div>

        <button
          type="button"
          class="menu__theme"
          [attr.aria-pressed]="theme.isDark()"
          (click)="theme.toggle()"
        >
          {{ theme.isDark() ? 'ESCURO' : 'CLARO' }}
        </button>
      </div>
    </nav>
  </div>
}
