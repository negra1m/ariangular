@if (data(); as d) {
  <div class="sec">
    <nav class="sec__crumb" aria-label="Breadcrumb">
      <ol>
        <li>
          <a [routerLink]="locale.path()">{{ locale.strings().home }}</a>
        </li>
        <li>
          <a [routerLink]="locale.path(d.part.id)">{{ d.part.title }}</a>
        </li>
        <!-- Item atual marcado com aria-current="page", como o próprio
             conteúdo ensina na seção de Breadcrumb. -->
        <li aria-current="page">{{ d.section.title }}</li>
      </ol>
    </nav>

    <div class="sec__cols">
      <!-- A barra lateral vem DEPOIS do artigo no DOM, e é reposicionada por
           CSS. Assim o Tab chega no conteúdo antes da lista de 30 links, e a
           ordem de leitura do leitor de tela é a que faz sentido. -->
      <article class="sec__main">
        <app-section-header
          [numeral]="d.part.numeral + '.' + d.section.order"
          [label]="'SEC—' + d.part.numeral"
          [title]="d.section.title"
          [lead]="d.section.summary"
        />

        <div class="sec__body">
          <app-block-render [blocks]="d.section.blocks" [context]="d.section.title" />
        </div>
      </article>

      <aside class="sec__aside">
        <!-- Índice desta seção antes do índice da parte: é o mais próximo do
             que a pessoa está lendo agora. -->
        <app-page-toc [blocks]="d.section.blocks" />
        <app-part-sidebar [part]="d.part" [currentId]="d.section.id" />
      </aside>
    </div>

    <!-- Sem isto, uma URL por seção vira 160 becos sem saída. -->
    <nav class="sec__pager" [attr.aria-label]="locale.strings().nav">
      @if (around().prev; as prev) {
        <a class="sec__pager-link" [routerLink]="locale.path(prev.part.id, prev.section.id)">
          <span class="sec__pager-dir">← {{ locale.strings().previous }}</span>
          <span class="sec__pager-title">{{ prev.section.title }}</span>
        </a>
      } @else {
        <span></span>
      }

      @if (around().next; as next) {
        <a
          class="sec__pager-link sec__pager-link--next"
          [routerLink]="locale.path(next.part.id, next.section.id)"
        >
          <span class="sec__pager-dir">{{ locale.strings().next }} →</span>
          <span class="sec__pager-title">{{ next.section.title }}</span>
        </a>
      }
    </nav>
  </div>
}
