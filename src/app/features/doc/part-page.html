@if (part(); as p) {
  <article class="part">
    <!-- A ilustração vem DEPOIS do cabeçalho no DOM, e é reposicionada por
         grid no desktop. Ordem de leitura sempre título → resumo → desenho,
         independentemente de onde o desenho esteja na tela (WCAG 1.3.2). -->
    <div class="part__intro">
      <app-section-header
        class="part__intro-text"
        [numeral]="p.numeral"
        [label]="'SEC—' + p.numeral"
        [title]="p.title"
        [lead]="p.summary"
      />
      <app-part-art class="part__intro-art" [partId]="p.id" />
    </div>

    <!-- Listagem no padrão da referência: linha com divisória, e no hover a
         linha inteira vira chapada na cor de acento. -->
    <ol class="part__list">
      @for (section of p.sections; track section.id) {
        <li class="part__row">
          <a class="part__link" [routerLink]="locale.path(p.id, section.id)">
            <span class="part__title">{{ section.title }}</span>
            <span class="part__summary">{{ section.summary }}</span>
            <span class="part__index" aria-hidden="true"> {{ p.numeral }}.{{ $index + 1 }} </span>
          </a>
        </li>
      }
    </ol>
  </article>
}
